name: omnira
x-api-env: &api-env
  OMNIRA_MYSQL_URL: mysql://omnira:${MYSQL_PASSWORD:?Run python tools/create_env.py}@mysql:3306/omnira
  OMNIRA_STORAGE_BACKEND: s3
  OMNIRA_S3_BUCKET: omnira-private
  OMNIRA_S3_ENDPOINT: http://minio:9000
  OMNIRA_S3_REGION: us-east-1
  OMNIRA_S3_ADDRESSING_STYLE: path
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Run python tools/create_env.py}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Run python tools/create_env.py}
  OMNIRA_SKIP_INIT: 'true'
  OMNIRA_CORS_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
x-api: &api
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: *api-env
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    storage-init:
      condition: service_completed_successfully
  healthcheck:
    test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready',timeout=5)"]
    interval: 15s
    timeout: 8s
    retries: 5
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: omnira
      MYSQL_USER: omnira
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run python tools/create_env.py}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python tools/create_env.py}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run python tools/create_env.py}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run python tools/create_env.py}
    volumes: [object-data:/data]
    ports: [127.0.0.1:9001:9001]
    restart: unless-stopped
  storage-init:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run python tools/create_env.py}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run python tools/create_env.py}
    depends_on: [minio]
    entrypoint: [/bin/sh, -c]
    command:
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing local/omnira-private
        mc anonymous set none local/omnira-private
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [python, -m, app.migrate]
    environment: *api-env
    depends_on:
      mysql:
        condition: service_healthy
  api-1:
    <<: *api
    environment:
      <<: *api-env
      OMNIRA_INSTANCE_ID: api-1
  api-2:
    <<: *api
    environment:
      <<: *api-env
      OMNIRA_INSTANCE_ID: api-2
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      OMNIRA_UPSTREAMS: http://api-1:8000,http://api-2:8000
    ports: [127.0.0.1:8080:8080]
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql-data:
  object-data:
