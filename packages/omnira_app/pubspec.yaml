name: omnira_app
description: Shared Omnira mobile and desktop application with durable offline sync.
publish_to: none
version: 0.2.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  sqflite: ^2.4.1
  sqflite_common_ffi: '>=2.3.4 <2.4.0'
  sqlite3_flutter_libs: ^0.5.29
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  crypto: ^3.0.6
  file_picker: ^8.3.7
  flutter_secure_storage: ^9.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
